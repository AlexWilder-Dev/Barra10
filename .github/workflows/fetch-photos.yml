name: Fetch photo candidates

on:
  push:
    branches: [claude/focused-fermat-x01isr]
    paths: [photo-queries.txt, known-ids.txt, tools/fetch_photos.py]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/fetch_photos.py
      - name: Commit photos
        run: |
          git config user.name "AlexWilder-Dev"
          git config user.email "a.wilder196@gmail.com"
          git add photos
          git commit -m "Add photo candidates" || echo "nothing to commit"
          git push
